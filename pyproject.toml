[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "beva"
version = "1.0.0"
description = "C-first lattice analysis, linear algebra, Gram-Schmidt and LLL reduction library"
requires-python = ">=3.9"
license = {text = "MIT"}

[tool.setuptools]
package-dir = {"" = "python"}
